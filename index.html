<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncTxt | Dev-Buffer</title>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
<style>
:root{--bg:#0d1117;--card:#161b22;--accent:#58a6ff;--accent-hover:#1f6feb;--text-main:#c9d1d9;--text-muted:#8b949e;--border:#30363d;--success:#238636}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;background:var(--bg);color:var(--text-main);margin:0;padding:20px;display:flex;flex-direction:column;align-items:center;min-height:100vh;box-sizing:border-box}
.container{width:100%;max-width:800px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:15px;box-sizing:border-box}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);padding-bottom:15px;gap:10px}
.left{display:flex;align-items:center;gap:12px;min-width:0}
.title{font-size:20px;font-weight:600;margin:0;display:flex;align-items:center;gap:10px}
.title::before{content:"</>";color:var(--accent);font-family:monospace;font-weight:bold}
.badge{font-size:12px;color:var(--accent);border:1px solid var(--border);border-radius:20px;padding:2px 10px;white-space:nowrap}
.status{font-size:13px;color:var(--text-muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.status-dot{width:8px;height:8px;background:var(--text-muted);border-radius:50%;transition:background .3s}
.status-dot.online{background:var(--success);box-shadow:0 0 8px var(--success)}
.status-dot.syncing{background:var(--accent);box-shadow:0 0 8px var(--accent)}
textarea{width:100%;height:40vh;background:#010409;color:var(--text-main);border:1px solid var(--border);border-radius:8px;padding:15px;font-family:Consolas,"Courier New",monospace;font-size:15px;line-height:1.5;resize:none;outline:none;box-sizing:border-box;transition:border-color .2s,box-shadow .2s}
textarea:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.controls{display:flex;justify-content:flex-end;gap:10px}
button,a.btn{background:var(--card);color:var(--text-main);border:1px solid var(--border);padding:8px 16px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:500;transition:all .2s;text-decoration:none;font-family:inherit}
button:hover,a.btn:hover{border-color:var(--text-muted);background:var(--border)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.burger{padding:6px 11px;font-size:18px;line-height:1}
input{background:#010409;color:var(--text-main);border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:16px;outline:none;box-sizing:border-box;min-width:0;flex:1;font-family:monospace;letter-spacing:.2em}
@media(max-width:600px){textarea{height:32vh}body{padding:10px}.container{padding:15px}}

/* меню */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:85vw;background:var(--card);border-right:1px solid var(--border);transform:translateX(-100%);transition:transform .25s;z-index:10;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;overflow-y:auto}
body.menu #drawer{transform:none}
body.menu .overlay{opacity:1;pointer-events:auto}
.dtitle{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted)}
.join{display:flex;gap:8px}
#roomBox{display:none;flex-direction:column;align-items:center;gap:10px;padding:14px;border:1px solid var(--border);border-radius:8px;background:#010409}
#roomCode{font-family:monospace;font-size:34px;letter-spacing:.25em;color:var(--accent);padding-left:.25em}
#recent{display:flex;flex-wrap:wrap;gap:8px}
body.inroom .badge{background:rgba(88,166,255,.15);border-color:var(--accent)}
body.inroom textarea{border-color:var(--accent)}
.note{display:none;background:#2d2000;border:1px solid #9e6a03;color:#e3b341;border-radius:8px;padding:8px 12px;font-size:13px}

/* файлы */
.divider{display:flex;align-items:center;gap:10px;color:var(--text-muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}
#peerInfo{font-size:12px;color:var(--text-muted);text-align:center;margin-top:-6px}
.dropzone{border:2px dashed var(--border);border-radius:8px;padding:18px;text-align:center;color:var(--text-muted);font-size:13px;cursor:pointer;transition:all .2s}
.dropzone:hover,.dropzone.dragover{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.06)}
.dropzone input{display:none}
.hint{display:block;margin-top:4px;font-size:11px;opacity:.75}
.file-list{display:flex;flex-direction:column;gap:8px}
.file-item{display:flex;align-items:center;gap:10px;background:#010409;border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.file-icon{font-family:monospace;font-size:16px;color:var(--accent);width:22px;text-align:center;flex-shrink:0}
.file-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.file-name{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-meta{font-size:11px;color:var(--text-muted)}
.progress-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:4px}
.progress-fill{height:100%;background:var(--accent);width:0;transition:width .15s linear}
.file-actions{display:flex;gap:6px;flex-shrink:0}
.file-actions .btn,.file-actions button{padding:5px 10px;font-size:12px}
.empty-note{font-size:12px;color:var(--text-muted);text-align:center;padding:6px 0}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>
<aside id="drawer">
    <div class="dtitle">Комнаты</div>
    <div id="roomBox">
        <div id="roomCode"></div>
        <button onclick="copyLink()" id="linkBtn">Скопировать ссылку</button>
        <button onclick="deleteRoom()">Удалить комнату</button>
    </div>
    <button class="primary" onclick="createRoom()">＋ Создать комнату</button>
    <div class="join">
        <input id="codeIn" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
        <button onclick="joinRoom()">Войти</button>
    </div>
    <button id="homeBtn" onclick="go(null)">← Главная комната</button>
    <div class="dtitle" id="recentTitle">Недавние</div>
    <div id="recent"></div>
</aside>

<div class="container">
    <div class="header">
        <div class="left">
            <button class="burger" id="burger" aria-label="Меню">☰</button>
            <h1 class="title">SyncTxt</h1>
            <span class="badge" id="roomBadge">Главная</span>
        </div>
        <div class="status"><div class="status-dot" id="statusDot"></div></div>
    </div>

    <div class="note" id="note"></div>

    <textarea id="syncArea" placeholder="Вставь код или текст сюда. Он автоматически появится на других устройствах в этой комнате..."></textarea>

    <div class="controls">
        <button onclick="clearText()">Очистить</button>
        <button onclick="pasteText()" id="pasteBtn">Вставить</button>
        <button class="primary" onclick="copyText()" id="copyBtn">Копировать</button>
    </div>

    <div class="divider">Файлы · напрямую между устройствами</div>
    <div id="peerInfo">Ожидание других устройств…</div>

    <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" multiple>
        <span id="dropzoneLabel">Перетащи файл сюда или нажми, чтобы выбрать</span>
        <span class="hint">Файл идёт напрямую на другое устройство (P2P), не через базу. Лимита размера нет — обе вкладки должны быть открыты.</span>
    </label>

    <div class="file-list" id="fileList"><div class="empty-note" id="emptyNote">Пока нет файлов</div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const SECRET = '3846';
const NOTES_URL = 'notes.html';
const ICE = { iceServers: [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    // Бесплатный публичный TURN — запасной путь, если прямое соединение невозможно (мобильные сети). Можно удалить или заменить своим.
    { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }
]};

firebase.initializeApp({ databaseURL: "https://messengerb-dcc80-default-rtdb.europe-west1.firebasedatabase.app" });
const database = firebase.database();
const TS = firebase.database.ServerValue.TIMESTAMP;
let srvOff = 0; // разница между часами устройства и сервера
database.ref('.info/serverTimeOffset').on('value', s => srvOff = s.val() || 0);
const offReady = new Promise(res => database.ref('.info/serverTimeOffset').once('value', s => { srvOff = s.val() || 0; res(); }));
function showNote(msg) { const n = $('note'); n.textContent = msg; n.style.display = msg ? 'block' : 'none'; }

const myId = Math.random().toString(36).slice(2, 10);
const myT = Date.now();
let room = null, textRef = null, sig = null, peers = {};
let isTyping = false, typingTimer;

const textarea = $('syncArea'), statusDot = $('statusDot');

/* ============ Меню ============ */
const setMenu = on => document.body.classList.toggle('menu', on);
$('burger').onclick = () => setMenu(true);
$('overlay').onclick = () => setMenu(false);
$('codeIn').addEventListener('input', e => e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4));
$('codeIn').addEventListener('keydown', e => { if (e.key === 'Enter') joinRoom(); });

function getRecent() { try { return JSON.parse(localStorage.getItem('rooms') || '[]'); } catch { return []; } }
function addRecent(c) {
    try { localStorage.setItem('rooms', JSON.stringify([c, ...getRecent().filter(x => x !== c)].slice(0, 6))); } catch {}
}
function renderRecent() {
    const box = $('recent'); box.innerHTML = '';
    const list = getRecent().filter(c => c !== room);
    $('recentTitle').style.display = list.length ? '' : 'none';
    list.forEach(c => { const b = document.createElement('button'); b.textContent = '# ' + c; b.onclick = () => go(c); box.appendChild(b); });
}

function roomUrl(c) { return location.origin + location.pathname + '?room=' + c; }
function copyLink() {
    navigator.clipboard.writeText(roomUrl(room)).then(() => {
        $('linkBtn').textContent = 'Скопировано!';
        setTimeout(() => $('linkBtn').textContent = 'Скопировать ссылку', 1500);
    });
}

const GRACE = 60 * 1000; // сколько комната живёт после того, как её покинул последний человек
async function roomExists(c) {
    await offReady;
    const [p, t] = await Promise.all([
        database.ref(`rooms/${c}/p2p/peers`).once('value'),
        database.ref(`rooms/${c}/meta/t`).once('value')
    ]);
    // жива, если в ней кто-то есть, либо последний вышел меньше минуты назад
    return t.exists() && (p.exists() || Date.now() + srvOff - t.val() < GRACE);
}
function dropRecent(c) { try { localStorage.setItem('rooms', JSON.stringify(getRecent().filter(x => x !== c))); } catch {} }

// Физически стираем комнату: текст, служебные данные и файлы в кэше этого устройства
async function expire(c) {
    try { await database.ref().update({ ['rooms/' + c]: null, ['room_index/' + c]: null }); } catch {}
    cacheDelRoom(c); dropRecent(c); renderRecent();
}
// «Уборщик»: любая открытая вкладка раз в 30 сек удаляет просроченные комнаты
async function sweep() {
    try {
        const idx = await database.ref('room_index').once('value');
        for (const c of Object.keys(idx.val() || {})) if (c !== room && !(await roomExists(c))) await expire(c);
        for (const k of await cacheKeys()) if (k !== 'main' && k !== room && !(await roomExists(k))) await cacheDelRoom(k);
        renderRecent();
    } catch (e) { console.error(e); }
}

async function createRoom() {
    try {
        for (let i = 0; i < 40; i++) {
            const c = String(Math.floor(1000 + Math.random() * 9000));
            if (c === SECRET || await roomExists(c)) continue; // 3846 никогда не выдаётся
            await database.ref().update({ ['rooms/' + c]: { text: '', meta: { t: TS } }, ['room_index/' + c]: true });
            return go(c);
        }
        alert('Не удалось подобрать свободный код, попробуй ещё раз');
    } catch (e) { alert('Не удалось создать комнату: ' + e.message + '\nПроверь правила Firebase для веток rooms и room_index'); }
}

function joinRoom() {
    const c = $('codeIn').value.trim();
    if (!/^\d{4}$/.test(c)) return alert('Введи 4 цифры');
    $('codeIn').value = '';
    go(c);
}

async function go(c) {
    if (c === SECRET) { location.href = NOTES_URL; return; }
    if (c) {
        let ok = false;
        try { ok = await roomExists(c); } catch (e) { return alert('Ошибка базы: ' + e.message); }
        if (!ok) { alert('Комната ' + c + ' не найдена или уже удалена'); expire(c); return; }
    }
    setMenu(false);
    enterRoom(c);
}

async function deleteRoom() {
    if (!room || !confirm(`Удалить комнату ${room} и весь её текст для всех?`)) return;
    const c = room;
    await enterRoom(null);
    await expire(c);
}

/* ============ Вход / выход из комнаты ============ */
let epoch = 0; // номер последнего входа: защита от «гонок» при быстром переключении комнат

async function leaveRoom() {
    if (!sig) return;
    const s = sig, r = room, me = s.child('peers/' + myId);
    clearTimeout(typingTimer); isTyping = false;
    textRef.off(); s.child('peers').off(); s.child('signals/' + myId).off();
    Object.keys(peers).forEach(dropPeer);
    sig = null;
    me.onDisconnect().cancel(); s.child('signals/' + myId).onDisconnect().cancel();
    if (r) database.ref(`rooms/${r}/meta/t`).onDisconnect().cancel();
    await me.remove();
    s.child('signals/' + myId).remove();
    if (r) database.ref(`rooms/${r}/meta/t`).set(TS); // с этого момента, если в комнате пусто, идёт минута до удаления
}

// Отмечаем «я в комнате»; при обрыве связи сервер сам снимет отметку и зафиксирует время выхода
async function announce() {
    if (!sig) return;
    const me = sig.child('peers/' + myId), r = room;
    me.onDisconnect().remove();
    sig.child('signals/' + myId).onDisconnect().remove();
    if (r) {
        const t = database.ref(`rooms/${r}/meta/t`);
        t.onDisconnect().set(TS);
        t.set(TS);
        database.ref('room_index/' + r).set(true);
    }
    await me.set({ t: myT });
}
database.ref('.info/connected').on('value', s => { if (s.val() && sig) announce().catch(console.error); });

async function enterRoom(c) {
    const my = ++epoch;
    textarea.readOnly = true; // пока идёт переключение, писать нельзя — иначе текст уйдёт не туда
    showNote('');
    await leaveRoom();
    if (my !== epoch) return;
    room = c;
    document.body.classList.toggle('inroom', !!c);
    textarea.value = '';
    document.querySelectorAll('.file-item').forEach(e => e.remove());
    $('emptyNote').style.display = '';
    $('roomBadge').textContent = c ? '# ' + c : 'Главная';
    $('roomBox').style.display = c ? 'flex' : 'none';
    $('homeBtn').style.display = c ? '' : 'none';
    history.replaceState(null, '', c ? '?room=' + c : location.pathname);
    if (c) { addRecent(c); $('roomCode').textContent = c; }
    renderRecent();
    loadCached(c || 'main');

    // Текст: у каждой комнаты своя ветка, у главной — своя
    textRef = database.ref(c ? `rooms/${c}/text` : 'shared_buffer/main_text');
    textRef.on('value', snap => {
        if (my !== epoch) return;
        textarea.readOnly = false; // новая комната загружена — можно писать
        statusDot.className = 'status-dot online';
        if (!isTyping) textarea.value = snap.val() || '';
    }, err => {
        if (my !== epoch) return;
        textarea.readOnly = false; statusDot.className = 'status-dot';
        showNote('Нет доступа к базе: ' + err.message);
    });

    // Сигналинг: через базу идут только крошечные служебные сообщения, сами файлы — нет
    sig = database.ref(c ? `rooms/${c}/p2p` : 'p2p/main');
    sig.child('peers').on('child_added', s => {
        const id = s.key; if (id === myId) return;
        const v = s.val() || {};
        // Предложение соединения отправляет тот, кто пришёл позже — так двойных попыток нет
        if (v.t < myT || (v.t === myT && id < myId)) connect(id);
    });
    sig.child('peers').on('child_removed', s => dropPeer(s.key));
    sig.child('signals/' + myId).on('child_added', s => {
        const m = s.val(); s.ref.remove();
        const p = mkPeer(m.from), d = JSON.parse(m.d);
        p.q = p.q.then(() => onSignal(p, m.from, m.k, d)).catch(console.error);
    });
    updateCount();
    await announce();
}

/* ============ Текст ============ */
textarea.addEventListener('input', () => {
    if (textarea.readOnly) return;
    isTyping = true;
    statusDot.className = 'status-dot syncing';
    clearTimeout(typingTimer);
    const ref = textRef, my = epoch;
    typingTimer = setTimeout(() => {
        if (my !== epoch) return;
        ref.set(textarea.value).then(() => {
            isTyping = false;
            statusDot.className = 'status-dot online';
        }).catch(err => { statusDot.className = 'status-dot'; console.error(err); });
    }, 500);
});

function clearText() {
    if (confirm(room ? 'Очистить текст для всех в комнате?' : 'Точно очистить буфер для всех устройств?')) {
        textarea.value = ''; textRef.set(''); textarea.focus();
    }
}

async function pasteText() {
    const btn = $('pasteBtn'), orig = btn.textContent, ref = textRef, my = epoch;
    try {
        const text = await navigator.clipboard.readText();
        if (my !== epoch) return; // за время запроса доступа сменили комнату
        clearTimeout(typingTimer); isTyping = false;
        textarea.value = text;
        textarea.blur();
        statusDot.className = 'status-dot syncing';
        await ref.set(text);
        statusDot.className = 'status-dot online';
        btn.textContent = 'Вставлено!';
    } catch (err) { console.error(err); btn.textContent = 'Нет доступа к буферу'; }
    setTimeout(() => btn.textContent = orig, 2000);
}

function copyText() {
    const btn = $('copyBtn'), orig = btn.textContent;
    textarea.select();
    document.execCommand('copy');
    btn.textContent = 'Скопировано!';
    btn.style.background = 'var(--success)'; btn.style.borderColor = 'var(--success)';
    setTimeout(() => { btn.textContent = orig; btn.style.background = ''; btn.style.borderColor = ''; }, 2000);
}

/* ============ WebRTC: P2P-соединения ============ */
function mkPeer(id) {
    if (peers[id]) return peers[id];
    const p = peers[id] = { pc: new RTCPeerConnection(ICE), dc: null, ice: [], rx: null, q: Promise.resolve() };
    p.pc.onicecandidate = e => e.candidate && sendSig(id, 'ice', e.candidate);
    p.pc.onconnectionstatechange = () => { if (['failed', 'closed'].includes(p.pc.connectionState)) dropPeer(id); };
    p.pc.ondatachannel = e => setupDc(id, e.channel);
    return p;
}

function sendSig(to, k, data) {
    if (sig) sig.child('signals/' + to).push({ from: myId, k, d: JSON.stringify(data) });
}

async function connect(id) {
    const p = mkPeer(id);
    setupDc(id, p.pc.createDataChannel('f'));
    await p.pc.setLocalDescription(await p.pc.createOffer());
    sendSig(id, 'offer', p.pc.localDescription);
}

async function onSignal(p, id, k, d) {
    if (k === 'ice') {
        if (p.pc.remoteDescription) await p.pc.addIceCandidate(d).catch(() => {});
        else p.ice.push(d);
        return;
    }
    await p.pc.setRemoteDescription(d);
    for (const c of p.ice.splice(0)) await p.pc.addIceCandidate(c).catch(() => {});
    if (k === 'offer') {
        await p.pc.setLocalDescription(await p.pc.createAnswer());
        sendSig(id, 'answer', p.pc.localDescription);
    }
}

function dropPeer(id) {
    const p = peers[id]; if (!p) return;
    if (p.rx) p.rx.row._m.textContent = 'Передача прервана';
    try { p.pc.close(); } catch {}
    delete peers[id];
    updateCount();
}

function updateCount() {
    const n = Object.values(peers).filter(p => p.dc && p.dc.readyState === 'open').length;
    $('peerInfo').textContent = n ? `Подключено устройств: ${n} — файлы идут напрямую` : 'Ожидание других устройств…';
}

function setupDc(id, dc) {
    const p = peers[id]; p.dc = dc;
    dc.binaryType = 'arraybuffer';
    dc.onopen = dc.onclose = updateCount;
    dc.onmessage = e => onData(p, e.data);
}

/* ============ Кэш файлов (IndexedDB, отдельно для каждой комнаты) ============ */
const idb = new Promise(res => {
    try {
        const r = indexedDB.open('synctxt', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('files', { keyPath: 'id' }).createIndex('room', 'room');
        r.onsuccess = () => res(r.result); r.onerror = () => res(null);
    } catch { res(null); }
});
const idbReq = r => new Promise((ok, no) => { r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
async function store(mode) { const d = await idb; return d && d.transaction('files', mode).objectStore('files'); }
async function cachePut(rec) { try { const s = await store('readwrite'); if (s) await idbReq(s.put(rec)); } catch (e) { console.error(e); } }
async function cacheDel(id) { try { const s = await store('readwrite'); if (s) await idbReq(s.delete(id)); } catch {} }
async function cacheList(key) { try { const s = await store('readonly'); return s ? await idbReq(s.index('room').getAll(key)) : []; } catch { return []; } }
async function cacheKeys() {
    try {
        const st = await store('readonly'); if (!st) return [];
        return await new Promise(ok => {
            const ks = new Set(), r = st.index('room').openKeyCursor();
            r.onsuccess = () => { const c = r.result; if (c) { ks.add(c.key); c.continue(); } else ok([...ks]); };
            r.onerror = () => ok([...ks]);
        });
    } catch { return []; }
}
async function cacheDelRoom(key) { for (const r of await cacheList(key)) await cacheDel(r.id); }
async function loadCached(key) {
    const list = await cacheList(key);
    if ((room || 'main') !== key) return; // за время чтения успели сменить комнату
    list.sort((a, b) => a.t - b.t).forEach(rec => finalize(addRow(rec.name, rec.size, '↓'), rec));
}
function finalize(row, rec) {
    const url = URL.createObjectURL(rec.blob);
    row._f.style.width = '100%';
    row._m.textContent = `Получено · ${fmt(rec.size)}`;
    const a = document.createElement('a');
    a.className = 'btn'; a.href = url; a.download = rec.name; a.textContent = 'Сохранить';
    const d = document.createElement('button');
    d.textContent = '✕'; d.title = 'Удалить';
    d.onclick = () => {
        cacheDel(rec.id); URL.revokeObjectURL(url); row.remove();
        if (!fileList.querySelector('.file-item')) $('emptyNote').style.display = '';
    };
    row._a.append(a, d);
}

/* ============ Передача файлов ============ */
const CH = 32 * 1024, BIG = 512 * 1024, MAX_BUF = 4 * 1024 * 1024;
const fileList = $('fileList');

function fmt(b) {
    if (b < 1024) return b + ' Б';
    if (b < 1048576) return (b / 1024).toFixed(1) + ' КБ';
    if (b < 1073741824) return (b / 1048576).toFixed(1) + ' МБ';
    return (b / 1073741824).toFixed(2) + ' ГБ';
}

function addRow(name, size, icon) {
    $('emptyNote').style.display = 'none';
    const r = document.createElement('div'); r.className = 'file-item';
    r.innerHTML = '<div class="file-icon"></div><div class="file-info"><div class="file-name"></div><div class="file-meta"></div><div class="progress-bar"><div class="progress-fill"></div></div></div><div class="file-actions"></div>';
    r.querySelector('.file-icon').textContent = icon;
    r.querySelector('.file-name').textContent = name;
    r._m = r.querySelector('.file-meta'); r._f = r.querySelector('.progress-fill'); r._a = r.querySelector('.file-actions');
    r._size = size;
    fileList.prepend(r);
    return r;
}
function prog(r, done, label) {
    r._f.style.width = Math.min(100, done / (r._size || 1) * 100) + '%';
    r._m.textContent = `${label} ${fmt(done)} / ${fmt(r._size)}`;
}

function onData(p, d) {
    if (typeof d === 'string') {
        const m = JSON.parse(d);
        if (m.t === 'meta') p.rx = { m, parts: [], got: 0, row: Object.assign(addRow(m.name, m.size, '↓'), {}) };
        else if (m.t === 'end' && p.rx) {
            const { m: meta, parts, row } = p.rx; p.rx = null;
            const type = meta.type || 'application/octet-stream';
            const rec = { id: Date.now() + '-' + Math.random().toString(36).slice(2, 7), room: room || 'main', name: meta.name, size: meta.size, type, t: Date.now(), blob: new Blob(parts, { type }) };
            cachePut(rec);
            finalize(row, rec);
        }
    } else if (p.rx) {
        p.rx.parts.push(d); p.rx.got += d.byteLength;
        prog(p.rx.row, p.rx.got, 'Приём');
    }
}

let sendQ = Promise.resolve();
function handleFiles(files) { files.forEach(f => sendQ = sendQ.then(() => sendFile(f)).catch(console.error)); }

async function sendFile(file) {
    const open = () => Object.values(peers).filter(p => p.dc && p.dc.readyState === 'open');
    if (!open().length) return alert('Нет подключённых устройств. Открой эту же комнату на другом устройстве.');
    const row = addRow(file.name, file.size, '↑');
    const send = (p, data) => p.dc.readyState === 'open' && p.dc.send(data);
    open().forEach(p => send(p, JSON.stringify({ t: 'meta', name: file.name, size: file.size, type: file.type })));
    let off = 0;
    while (off < file.size) {
        const buf = await file.slice(off, off + BIG).arrayBuffer();
        for (let i = 0; i < buf.byteLength; i += CH) {
            const part = new Uint8Array(buf, i, Math.min(CH, buf.byteLength - i));
            for (const p of open()) {
                while (p.dc.bufferedAmount > MAX_BUF && p.dc.readyState === 'open') await new Promise(r => setTimeout(r, 15));
                send(p, part);
            }
        }
        off += buf.byteLength;
        prog(row, off, 'Отправка');
    }
    for (const p of open()) { while (p.dc.bufferedAmount > 0 && p.dc.readyState === 'open') await new Promise(r => setTimeout(r, 15)); send(p, JSON.stringify({ t: 'end' })); }
    row._f.style.width = '100%';
    row._m.textContent = `Отправлено · ${fmt(file.size)}`;
}

/* ============ Dropzone ============ */
const dropzone = $('dropzone'), fileInput = $('fileInput');
if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) $('dropzoneLabel').textContent = 'Нажми, чтобы выбрать файл';
fileInput.addEventListener('change', () => { if (fileInput.files.length) { handleFiles(Array.from(fileInput.files)); fileInput.value = ''; } });
['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
dropzone.addEventListener('drop', e => { if (e.dataTransfer.files.length) handleFiles(Array.from(e.dataTransfer.files)); });

/* ============ Старт ============ */
window.addEventListener('pagehide', () => { if (sig) { sig.child('peers/' + myId).remove(); if (room) database.ref(`rooms/${room}/meta/t`).set(TS); } });
(async function init() {
    const c = new URLSearchParams(location.search).get('room');
    if (c === SECRET) { location.replace(NOTES_URL); return; }
    let ok = false, err = null;
    if (/^\d{4}$/.test(c || '')) { try { ok = await roomExists(c); } catch (e) { err = e; } }
    await enterRoom(ok ? c : null);
    if (c && !ok) showNote(err ? `Не удалось открыть комнату ${c}: ${err.message}` : `Комната ${c} не найдена или уже закрыта — открыта ГЛАВНАЯ комната.`);
    sweep(); setInterval(sweep, 30000);
})();
</script>
